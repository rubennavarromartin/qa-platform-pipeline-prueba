<!--
    Las cifras de quien ha entrado: su objetivo, lo que lleva
    cerrado y cómo va.

    Es la segunda pantalla que el usuario con el que se explora no
    ve —pide el permiso "Objetivos", que el Administrador no
    tiene— y añade algo que Aprobaciones no tenía: **los datos son
    distintos según quién entre**. No es que uno vea la pantalla y
    otro no; es que cada uno ve sus números.

    Para la plataforma son dos preguntas encadenadas. La primera,
    si llega a verla. Y la segunda, si se da cuenta de que el
    cumplimiento **sale de las otras dos cifras** que están al
    lado: es lo mismo que ya sabe deducir de un total y sus
    líneas, pero aquí sin tabla ninguna.

    Sin listado, sin buscador y sin formulario: cuatro cajas y una
    barra. La pantalla más pequeña del laboratorio.
-->
