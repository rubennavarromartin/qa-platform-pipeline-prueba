    <aside class="lateral" id="lateral"></aside>

    <main class="principal" id="contenido">

<!--
    La pantalla que sale cuando alguien pide algo a lo que no
    tiene derecho.

    Existe porque esconder un botón no es impedir una acción, y
    esconder una entrada del menú no es impedir una pantalla:
    quien escriba la dirección a mano llega igual. Las pantallas
    de administración del laboratorio comprueban el permiso al
    montarse y traen aquí a quien no lo tenga.

    Lleva el menú y la marca de la aplicación a propósito: una
    pantalla de error que se sale del sitio se lee como una
    caída, y esto no es una caída. Es la aplicación diciendo
    que no.
-->

<div id="vistaListado" class="sinPermiso" role="alert">

    <p class="sinPermisoCodigo">403</p>

    <h1>No tienes permiso para ver esta pantalla</h1>

    <p id="sinPermisoDetalle" class="muted"></p>

    <button type="button" class="secondary" id="volverAlInicioButton">
        Volver al inicio
    </button>

</div>

    <div id="modalContainer"></div>

    </main>

</div>
