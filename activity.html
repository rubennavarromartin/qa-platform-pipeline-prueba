<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actividad · CRM Laboratory</title>

    <link rel="stylesheet" href="css/marca.css">
    <link rel="stylesheet" href="css/crm.css">

    <!--
    | El tema se fija antes de pintar nada, para que la página no
    | aparezca un instante en claro antes de ponerse oscura.
    -->

    <script src="js/entorno.js"></script>
    <script src="js/tema.js"></script>

</head>

<body data-modulo="activity">

<a class="saltar" href="#contenido">
    Saltar al contenido
</a>

<div class="disposicion">

    <aside class="lateral" id="lateral"></aside>

    <main class="principal" id="contenido">

<!--
    El log de actividad.

    Era la única pantalla del laboratorio que no dejaba tocar nada,
    y sigue sin alta ni edición. Desde el 16 de octubre de 2026 cada
    línea se puede quitar —y pregunta antes—, porque hacía falta una
    pantalla sin alta, con borrado por fila y paginada sin "todos":
    la prueba de borrar actúa sobre la primera fila, y al quitarla
    entra la siguiente. Vaciarla entera también pregunta.
-->

<div id="vistaListado">

    <h1>Actividad</h1>

    <section id="panelListado">

        <div class="toolbar">

            <div class="toolbar-left">

                <label for="logEntidad" class="filtroEtiqueta">
                    Entidad
                </label>

                <select id="logEntidad">
                    <option value="">Todas</option>
                </select>

                <label for="logAccion" class="filtroEtiqueta">
                    Acción
                </label>

                <select id="logAccion">
                    <option value="">Todas</option>
                    <option value="Alta">Alta</option>
                    <option value="Edición">Edición</option>
                    <option value="Baja">Baja</option>
                </select>

                <!--
                Los filtros de Unidades de SABESP: un desplegable de varias
                opciones cuyo campo con nombre está escondido, y que no filtra
                al elegir sino al pulsar "Aplicar". Medido el 15 de octubre de
                2026. La forma entera está contada en js/components/multiselect.js.
                -->
                <label for="logUsuario" class="filtroEtiqueta">
                    Usuario
                </label>

                <div class="multiselect">
                    <div class="oculto-accesible">
                        <input
                            id="logUsuario"
                            role="combobox"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                            readonly>
                    </div>
                    <span class="multiselect-rotulo"></span>
                    <span class="multiselect-flecha" aria-hidden="true">▾</span>
                </div>

                <button id="aplicarFiltros" type="button" class="btn-secondary">
                    Aplicar
                </button>

                <button id="limpiarFiltros" type="button" class="btn-secondary">
                    Limpiar
                </button>

            </div>

            <!--
            El buscador de SABESP: no dice que lo sea —se llama "fBusca" y
            su ayuda dice qué se puede escribir, no que se busca— y no filtra
            al escribir, sino al pulsar Enter, y tarda lo que tarda un
            servidor. Medido el 14 de octubre de 2026.
            -->
            <input
                id="fActividad"
                type="text"
                placeholder="Usuario, entidad o registro">

        </div>

        <table id="activityGrid">

            <thead>

                <tr>

                    <th>Cuándo</th>
                    <!--
                    Ordena como una tabla que pide cada página al servidor: la
                    lista entera, y después se recorta la página. Ordenar no
                    reordena las cinco filas que se ven, trae otras. Es la
                    ordenación de SABESP, medida el 14 de octubre de 2026.
                    -->
                    <th id="ordenUsuario" aria-sort="none" style="cursor:pointer">Usuario</th>
                    <th>Entidad</th>
                    <th>Acción</th>
                    <th>Registro</th>
                    <th>Detalle</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

        <p
            id="activityVacio"
            class="aviso"
            role="status">
        </p>

        <div id="paginacion"></div>

        <div class="seleccion-barra">

            <button
                id="vaciarLogButton"
                class="btn-delete"
                type="button">
                🗑 Vaciar la actividad
            </button>

        </div>

    </section>

</div>

    <div id="modalContainer"></div>

    </main>

</div>

    <script src="js/companies/companyRepository.js"></script>
    <script src="js/contacts/contacts.js"></script>
    <script src="js/agenda/appointmentRepository.js"></script>
    <script src="js/quotes/quoteRepository.js"></script>
    <script src="js/users/userRepository.js"></script>
    <script src="js/roles/roleRepository.js"></script>

    <script src="js/components/toast.js"></script>
    <script src="js/components/confirm.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/navigation.js"></script>
    <script src="js/components/session.js"></script>
    <script src="js/components/permissions.js"></script>
    <script src="js/components/settings.js"></script>
    <script src="js/components/orden.js"></script>
    <script src="js/components/activityLog.js"></script>
    <script src="js/components/pagination.js"></script>
    <script src="js/components/multiselect.js"></script>
    <script src="js/components/layout.js"></script>

    <script src="js/activity/app.js"></script>

</body>

</html>
