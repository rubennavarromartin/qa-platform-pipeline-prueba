<!--
    Pantallas que no tienen dirección propia.

    Es la forma de la facturación de ejemplo, traída a donde se puede
    medir en cada Build: su cinta abre cada entrada como una ventana
    dentro de la misma página, como el programa de escritorio que imita,
    y la dirección no cambia nunca. El Discovery contaba las pantallas
    por su dirección y de toda la facturación leyó una: 1 pantalla y 5
    pruebas, el 17 de octubre de 2026.

    Aquí la barra de Almacén abre dos ventanas —Artículos y Ubicaciones—
    con su pestaña, en un escritorio, y cada una con su tabla y su
    buscador. Lo que se pregunta es si la plataforma las reconoce como
    pantallas aunque la dirección siga siendo almacen.html, y si las
    pruebas que salen de ellas saben llegar: abrir la página y pulsar.

    Nada aquí dice "ventana" de forma que se pueda buscar: se reconocen
    por lo que aparece al pulsar. Y no se acuerdan de nada al recargar,
    como la de verdad: cada prueba tiene que volver a abrirlas.
-->

<h1>Almacén</h1>

<p class="ayuda">
    Los artículos y dónde están. Cada uno se abre en su ventana.
</p>

<nav class="toolbar" id="barraAlmacen" aria-label="Almacén">

    <button type="button" class="btn" id="abrirArticulos">Artículos</button>

    <button type="button" class="btn" id="abrirUbicaciones">Ubicaciones</button>

</nav>

<div role="tablist" id="pestanasAlmacen" aria-label="Ventanas abiertas"></div>
